<!DOCTYPE html>
<html lan="english">
    <head>
        <title>registration form</title>
    </head>
    <body>
        <div>
            <form>
                <div>
                    <label for="first">NAME</label>
                    <span style="color: brown;">*</span>
                    <span style="color:black;">:</span>
                    <input type="text" id="first" required>
                </div>
                <div>
                    <label for="second">EMAIL</label>
                    <span style="color: brown;">*</span>
                    <span style="color:black;">:</span>
                    <input type="email" id="second" required>
                </div>
                <div>
                    <label for="third">PHONE</label>
                    <span style="color: brown;">*</span>
                    <span style="color:black;">:</span>
                    <input type="number" id="third" required>
                </div>
                <div>
                    <label for="fourth">PASSWORD</label>
                    <span style="color: brown;">*</span>
                    <span style="color:black;">:</span>
                    <input type="password" id="fourth" required>
                </div>
                <div>
                    <label for="fifth">CONFIRM PASSWORD</label>
                    <span style="color: brown;">*</span>
                    <span style="color:black;">:</span>
                    <input type="password" id="fifth" required>
                </div>
                <div>
                    <label>aadhar no</label>
                    <input type="checkbox">
                    <label>pan card</label>
                    <input type="checkbox">
                    <label>voter id</label>
                    <input type="checkbox">
                    <label>passport</label>
                    <input type="checkbox">
                </div>
            </form>
        </div>
    </body>
</html>
